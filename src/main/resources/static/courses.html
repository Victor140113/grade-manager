<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Matérias · 1º Semestre</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-mark">GM</div>
            <strong>Grade Manager</strong></div>
        <nav class="nav">
            <div class="nav-title">Navegação</div>
            <a href="index.html">⌂ Dashboard</a><a href="managers.html" class="active">▦ Grades de Notas</a>
        </nav>
        <div class="userbox">
            <div class="avatar">V</div>
            <div><strong>Victor</strong><small>Desenvolvedor</small></div>
        </div>
    </aside>
    <main class="main">
        <a class="btn" id="btn-back">← Voltar</a>
        <div class="breadcrumb"><a href="managers.html">Faculdade</a> / <a href="semesters.html">1º Semestre</a> /
            Matérias
        </div>
        <header class="top">
            <div>
                <div class="eyebrow"></div>
                <h1>Matérias</h1>
            </div>
            <button class="btn primary" id="modal-open">+ Nova matéria</button>
        </header>

        <section class="grid grid-2" id="grid-cards">

        </section>


    </main>

    <!-- ----------- Modal ----------- -->

    <div class="modal-overlay hidden" id="modal">
        <div class="modal">

            <div class="modal-header">
                <div>
                    <div class="eyebrow">Novo registro</div>
                    <h2 id="modal-title">Nova Matéria</h2>
                </div>

                <button class="modal-close" id="modal-close">×</button>
            </div>

            <form id="modal-form" data-type="" data-id="">

                <div class="form-group">
                    <label for="modal-input" id="modal-label">Nome</label>
                    <input
                            type="text"
                            id="modal-input"
                            name="name"
                            placeholder="Digite o nome"
                            required
                    >
                </div>

                <div class="form-group hidden" id="modal-value-group">
                    <label for="modal-value">Valor</label>
                    <input
                            type="number"
                            id="modal-value"
                            name="value"
                            placeholder="Digite o valor"
                            step="0.001"
                    >
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn" id="modal-cancel">
                        Cancelar
                    </button>

                    <button type="submit" class="btn primary" id="modal-create">
                        Criar
                    </button>
                </div>

            </form>

        </div>
    </div>

    <!-- Modal Exclusão -->

    <div id="delete-modal" class="modal-overlay hidden">

        <div class="modal">

            <div class="modal-header">

                <div>
                    <div class="eyebrow">Confirmação</div>
                    <h2 id="delete-modal-title">Excluir item?</h2>
                </div>

                <button
                        id="delete-modal-close"
                        class="modal-close"
                        type="button"
                        aria-label="Fechar"
                >
                    &times;
                </button>

            </div>

            <p id="delete-modal-text">

            </p>

            <div class="modal-actions">

                <button
                        id="delete-modal-cancel"
                        class="btn"
                        type="button"
                >
                    Cancelar
                </button>

                <button
                        id="delete-modal-confirm"
                        class="btn danger"
                        type="button"
                >
                    Excluir
                </button>

            </div>

        </div>

    </div>
</div>

<script src="js/courses.js"></script>
</body>
</html>
