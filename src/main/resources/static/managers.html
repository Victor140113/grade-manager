<!doctype html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <title>Grade Managers</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app">
    <aside class="sidebar">
        <div class="brand">
            <div class="brand-mark">GM</div>
            <strong>Grade Manager</strong></div>
        <nav class="nav">
            <div class="nav-title">Navegação</div>
            <a href="index.html">⌂ Dashboard</a><a class="active" href="managers.html">▦ Grades de Notas</a>
        </nav>
        <div class="userbox">
            <div class="avatar">V</div>
            <div><strong>Victor</strong><small>Desenvolvedor</small></div>
        </div>
    </aside>
    <main class="main">
        <header class="top">
            <div>
                <div class="eyebrow">Grades de Notas</div>
                <h1>Minhas Grades</h1>
                <p class="subtitle">Suas Grades de Notas</p></div>
            <button class="btn primary" id="modal-open">+ Nova Grade de Notas</button>
        </header>
        <section class="grid grid-3" id="grid-cards">

        </section>
    </main>

    <!-- ----------- Modal ----------- -->

    <div class="modal-overlay hidden" id="modal">
        <div class="modal">

            <div class="modal-header">
                <div>
                    <div class="eyebrow">Novo registro</div>
                    <h2 id="modal-title">Nova Grade</h2>
                </div>

                <button class="modal-close" id="modal-close">×</button>
            </div>

            <form id="modal-form">

                <div class="form-group">
                    <label for="modal-input" id="modal-label">Nome</label>
                    <input
                            type="text"
                            id="modal-input"
                            name="name"
                            placeholder="Digite o name"
                            required
                    >
                </div>

                <div class="modal-actions">
                    <button type="button" class="btn" id="modal-cancel">
                        Cancelar
                    </button>

                    <button type="submit" class="btn primary" id="btn-create">
                        Criar
                    </button>
                </div>

            </form>

        </div>
    </div>

</div>

<script src="js/managers.js"></script>
</body>
</html>
